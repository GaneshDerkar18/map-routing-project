<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLayers + Directions</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
    .form-container { padding: 10px; position: absolute; top: 10px; left: 10px; z-index: 100; }
    input[type="text"], button { padding: 8px; margin: 5px; }
  </style>
</head>
<body>

<!-- Form for user input -->
<div class="form-container">
  <input type="text" id="startCity" placeholder="Start City" />
  <input type="text" id="endCity" placeholder="End City" />
  <button onclick="getRoute()">Get Directions</button>
</div>

<!-- Map container -->
<div id="map"></div>

<!-- OpenLayers JS -->
<script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>

<script>
  // Initialize OpenLayers map
  const map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.OSM()
      })
    ],
    view: new ol.View({
      center: ol.proj.fromLonLat([77.5946, 12.9716]), // Default center: Bangalore
      zoom: 12
    })
  });

  // Function to fetch route based on city names
  function getRoute() {
  const startCity = document.getElementById('startCity').value;
  const endCity = document.getElementById('endCity').value;

  if (!startCity || !endCity) {
    alert('Please enter both start and end cities.');
    return;
  }

  // Fetch route data from our Node.js proxy server
  fetch('http://localhost:3000/route', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      startCity: startCity,
      endCity: endCity
    })
  })
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }
    return response.json();
  })
  .then(data => {
    if (data && data.features && data.features.length > 0) {
      // Extract route from the GeoJSON response
      const features = new ol.format.GeoJSON().readFeatures(data, {
  dataProjection: 'EPSG:4326',
  featureProjection: 'EPSG:3857'
});

// Create a vector layer for the route
const routeLayer = new ol.layer.Vector({
  source: new ol.source.Vector({
    features: features
  }),
style: new ol.style.Style({
          stroke: new ol.style.Stroke({
            color: '#FF0000',
            width: 4
          })
        })
      });

      // Add the route layer to the map
      map.addLayer(routeLayer);

      // Set map view to center on the route
      const extent = routeLayer.getSource().getExtent();
map.getView().fit(extent, { padding: [50, 50, 50, 50], maxZoom: 14 });

    } else {
      console.error('No route data found', data);
      alert('No route found or error in fetching directions.');
    }
  })
  .catch(err => {
    console.error('Error fetching route:', err);
    alert(`Failed to fetch directions: ${err.message}`);
  });
}

</script>

</body>
</html>
